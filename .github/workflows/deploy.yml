name: Deploy to production

# Triggers:
#   - push to main → auto-deploy (main use case)
#   - workflow_dispatch → manual re-deploy from the Actions tab
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST      doms.geu.ac.in
#   EC2_USER      ec2-user
#   EC2_SSH_KEY   the ENTIRE contents of key.pem, including BEGIN/END lines
# Optional (only if defaults don't match):
#   EC2_PORT      SSH port (default 22)
#   APP_DIR       repo checkout on server (default /opt/doms/app)
#   PM2_BACKEND   pm2 process name (default doms-backend)
#   PM2_FRONTEND  pm2 process name (default doms-frontend)
#
# Env files (backend/.env, frontend/.env.local) live on the EC2 server
# and are gitignored — the workflow never touches them. To change an env
# var, SSH in once and edit the file, then re-run this workflow (or push
# any change to main to trigger a reload).

on:
  push:
    branches: [main]
    # Skip the workflow when only docs/CI files change — nothing to deploy.
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - 'scripts/systemd/**'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false  # never cancel an in-flight deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Preflight — check secrets are present
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          echo "HOST length: ${#HOST}"
          echo "USER length: ${#USER}"
          echo "KEY length: ${#KEY}"
          test -n "$HOST" || { echo "::error::EC2_HOST secret is empty"; exit 1; }
          test -n "$USER" || { echo "::error::EC2_USER secret is empty"; exit 1; }
          test -n "$KEY"  || { echo "::error::EC2_SSH_KEY secret is empty"; exit 1; }

      - name: Set up SSH key + known_hosts
        env:
          KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          head -1 ~/.ssh/id_deploy
          tail -1 ~/.ssh/id_deploy
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=30 \
              "$USER@$HOST" \
              'bash /opt/doms/app/scripts/deploy.sh'
