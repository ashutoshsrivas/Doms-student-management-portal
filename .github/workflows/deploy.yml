name: Deploy to production

# Triggers:
#   - push to main → auto-deploy (main use case)
#   - workflow_dispatch → manual re-deploy from the Actions tab
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST      doms.geu.ac.in
#   EC2_USER      ec2-user
#   EC2_SSH_KEY   the ENTIRE contents of key.pem, including BEGIN/END lines
# Optional (only if defaults don't match):
#   EC2_PORT      SSH port (default 22)
#   APP_DIR       repo checkout on server (default /opt/doms/app)
#   PM2_BACKEND   pm2 process name (default doms-backend)
#   PM2_FRONTEND  pm2 process name (default doms-frontend)
#
# Env files (backend/.env, frontend/.env.local) live on the EC2 server
# and are gitignored — the workflow never touches them. To change an env
# var, SSH in once and edit the file, then re-run this workflow (or push
# any change to main to trigger a reload).

on:
  push:
    branches: [main]
    # Skip the workflow when only docs/CI files change — nothing to deploy.
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - 'scripts/systemd/**'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false  # never cancel an in-flight deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: SSH into EC2 and run deploy.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          command_timeout: 15m
          # Pass overrides for pm2 process names if your services aren't
          # named doms-backend / doms-frontend. Set them as repo secrets.
          envs: PM2_BACKEND,PM2_FRONTEND,APP_DIR
          script_stop: true
          script: |
            export PM2_BACKEND="${{ secrets.PM2_BACKEND }}"
            export PM2_FRONTEND="${{ secrets.PM2_FRONTEND }}"
            export APP_DIR="${{ secrets.APP_DIR }}"
            bash "${APP_DIR:-/opt/doms/app}/scripts/deploy.sh"
