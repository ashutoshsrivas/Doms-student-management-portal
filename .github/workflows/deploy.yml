name: Deploy to production

# Initial trigger: manual only (workflow_dispatch). This is intentional —
# you must add the required secrets and run a manual deploy successfully
# at least once before enabling auto-deploy on push.
#
# To enable auto-deploy after the first manual run succeeds, uncomment the
# `push` trigger below.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false  # never cancel an in-flight deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: SSH into EC2 and run deploy.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          command_timeout: 15m
          # Pass overrides for pm2 process names if your services aren't
          # named doms-backend / doms-frontend. Set them as repo secrets.
          envs: PM2_BACKEND,PM2_FRONTEND,APP_DIR
          script_stop: true
          script: |
            export PM2_BACKEND="${{ secrets.PM2_BACKEND }}"
            export PM2_FRONTEND="${{ secrets.PM2_FRONTEND }}"
            export APP_DIR="${{ secrets.APP_DIR }}"
            bash "${APP_DIR:-/opt/doms/app}/scripts/deploy.sh"
